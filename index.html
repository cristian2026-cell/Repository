<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocoPlan Pro — Productividad Visual</title>
  <!-- Fuentes externas -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js Oficial para Gráficos Profesionales -->
  <script src="https://jsdelivr.net"></script>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <span class="logo">🎯 FocoPlan Pro</span>
      <button id="theme-toggle" class="btn-theme">🌙 Modo Oscuro</button>
    </div>
  </nav>

  <div class="dashboard-container">
    
    <!-- CONTENIDO IZQUIERDO: Temporizador y Gráficos -->
    <main class="main-content">
      <!-- Tarjeta del Temporizador -->
      <section class="card timer-card">
        <span class="badge">Sesión de Enfoque</span>
        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-controls">
          <button id="start-btn" class="btn btn-primary">Iniciar</button>
          <button id="reset-btn" class="btn btn-secondary">Reiniciar</button>
        </div>
      </section>

      <!-- Tarjeta de Gráficos Estadísticos -->
      <section class="card chart-card">
        <h2>Rendimiento Semanal</h2>
        <p class="section-subtitle">Sesiones de enfoque completadas esta semana.</p>
        <div class="chart-wrapper">
          <canvas id="productivityChart"></canvas>
        </div>
      </section>
    </main>

    <!-- CONTENIDO DERECHO: Tareas -->
    <aside class="sidebar">
      <section class="card todo-card">
        <h2>Tareas del Día</h2>
        <p class="section-subtitle">Organiza tus objetivos antes de iniciar el reloj.</p>
        
        <form id="todo-form" class="todo-form">
          <input type="text" id="todo-input" placeholder="¿En qué vas a trabajar?" required maxlength="60">
          <button type="submit" class="btn-add">+</button>
        </form>

        <ul id="todo-list" class="todo-list"></ul>
      </section>
    </aside>

  </div>

  <footer class="app-footer">
    <p>&copy; 2026 FocoPlan Pro &bull; Dashboard Analítico de Enfoque</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
